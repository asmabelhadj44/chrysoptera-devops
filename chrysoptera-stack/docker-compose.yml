services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chrysoptera
      POSTGRES_PASSWORD: chrysoptera_dev
      POSTGRES_DB: chrysoptera_dev
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"